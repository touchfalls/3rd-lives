name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        run: ./gradlew clean dist test verifyJars

      - name: Upload Paper jar
        uses: actions/upload-artifact@v4
        with:
          name: lifesmp-paper
          path: dist/paper/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: lifesmp-fabric
          path: dist/fabric/
          if-no-files-found: error
          retention-days: 14

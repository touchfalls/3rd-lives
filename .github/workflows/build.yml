name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fabric Loom needs Gradle to run on Java 25+. 1.21.1 code is compiled with Java 21, Minecraft 26.x code with Java 25.
      # The last listed version becomes JAVA_HOME and runs Gradle.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        run: ./gradlew clean dist test verifyJars -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Upload Paper jar
        uses: actions/upload-artifact@v4
        with:
          name: lifesmp-paper
          path: dist/paper/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: lifesmp-fabric
          path: dist/fabric/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Fabric 26.x jar
        uses: actions/upload-artifact@v4
        with:
          name: lifesmp-fabric-26
          path: dist/fabric-26/
          if-no-files-found: error
          retention-days: 14

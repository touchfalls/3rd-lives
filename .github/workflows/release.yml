name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fabric Loom needs Gradle to run on Java 25+; the sources are compiled with the Java 21 toolchain.
      # The last listed version becomes JAVA_HOME and runs Gradle.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Build and test
        run: ./gradlew clean dist test verifyJars -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Check tag matches mod_version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MOD_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version=${MOD_VERSION} in gradle.properties"
            exit 1
          fi
          echo "VERSION=${MOD_VERSION}" >> "$GITHUB_ENV"

      # Local builds keep their own names in dist/; platform-specific names are applied only here.
      - name: Rename jars for release
        run: |
          mkdir -p release
          PAPER_JAR=$(find dist/paper -maxdepth 1 -name '*.jar' | head -n 1)
          FABRIC_JAR=$(find dist/fabric -maxdepth 1 -name '*.jar' | head -n 1)
          test -n "$PAPER_JAR" && test -n "$FABRIC_JAR"
          cp "$PAPER_JAR" "release/lifesmp-paper-${VERSION}.jar"
          cp "$FABRIC_JAR" "release/lifesmp-fabric-${VERSION}.jar"
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Life SMP ${{ env.VERSION }}
          body_path: docs/release-notes/${{ env.VERSION }}.md
          files: |
            release/lifesmp-paper-${{ env.VERSION }}.jar
            release/lifesmp-fabric-${{ env.VERSION }}.jar
          fail_on_unmatched_files: true

# Life SMP messages: English (en). This file is the fallback for every other language.

pvp.red-cannot-attack-red={prefix}<red>You cannot attack while you have 1 life</red>
pvp.cannot-attack-red={prefix}<red>You cannot attack a player who has 1 life</red>

death.ban-kick=<red><bold>☠ YOU HAVE LOST ALL YOUR LIVES</bold></red>\n\n<gray>Reason:</gray> <white>No lives left</white>\n<gray>Ban duration:</gray> <yellow>{time}</yellow>\n\n<dark_gray>Contact the server staff for details</dark_gray>
death.ban-join=<red><bold>You are banned for losing all your lives</bold></red>\n\n<gray>Time remaining:</gray> <yellow>{time}</yellow>\n<dark_gray>Wait until the ban ends or for a pardon from an administrator.</dark_gray>
death.life-lost=<dark_gray>▪ <red>☠ You died.</red> <gray>Lives left:</gray> {hearts} <gray>({lives}/{max})</gray>
death.last-life-warning=<red><bold>This is your last life.</bold></red> <gray>Your next death will ban you for {time}.</gray>
death.arena-death={prefix}<gold>You died in an arena. Your life was kept.</gold>

regen.life-gained={prefix}<green>You regained a life. Current lives: {lives}</green>

gift.sent={prefix}<green>You offered a life to <yellow>{player}</yellow>. Waiting for confirmation ({time}).</green>
gift.received={prefix}<gold><yellow>{player}</yellow> wants to give you a life. Type <click:run_command:'/life accept'><green>/life accept</green></click> within {time}.</gold>
gift.accepted-donor={prefix}<green><yellow>{player}</yellow> accepted your gift. Accelerated regeneration is now active.</green>
gift.accepted-recipient={prefix}<green>You accepted a life from <yellow>{player}</yellow>. Your lives: {lives}.</green>
gift.expired={prefix}<red>The life gift request has expired or was cancelled.</red>
gift.cannot-gift-self={prefix}<red>You cannot give a life to yourself.</red>
gift.donor-last-life={prefix}<red>You cannot give away your last life. You need at least 2 lives.</red>
gift.recipient-max-lives={prefix}<red>This player already has the maximum number of lives.</red>
gift.no-pending={prefix}<red>You have no pending life gift requests.</red>
gift.player-offline={prefix}<red>Player <yellow>{player}</yellow> was not found or is offline.</red>
gift.cannot-afford={prefix}<red>You cannot afford to give a life.</red>
gift.failed={prefix}<red>The life gift could not be completed.</red>

info.header=<dark_gray>──────</dark_gray> {color}<bold>Life SMP</bold></color> <dark_gray>──────</dark_gray>
info.lives=<gray>Lives:</gray> {hearts} <gray>({lives}/{max})</gray>
info.next-life=<gray>Next life in:</gray> <yellow>{time}</yellow>
info.full-lives=<gray>Next life in:</gray> <green>lives are full</green>
info.mode-gift=<gray>Accelerated regeneration:</gray> <green>active</green> <gray>(interval {time})</gray>
info.mode-normal=<gray>Normal regeneration</gray> <gray>(interval {time})</gray>
info.afk-paused=<yellow>Timer paused: AFK</yellow>
info.footer=<dark_gray>────────────────────────</dark_gray>

arena.created={prefix}<green>Arena '{name}' was created and enabled.</green>
arena.removed={prefix}<green>Arena '{name}' was removed.</green>
arena.not-found={prefix}<red>Arena '{name}' was not found.</red>
arena.already-exists={prefix}<red>An arena named '{name}' already exists. Remove it first or choose another name.</red>
arena.status-updated={prefix}<green>Arena '{name}' is now {status}.</green>
arena.status-enabled=<green>enabled</green>
arena.status-disabled=<red>disabled</red>
arena.list-header=<gold>Arenas ({count})</gold>
arena.list-entry=<gray>- <yellow>{name}</yellow> ({world}: {x1},{y1},{z1} -> {x2},{y2},{z2}) [{status}]</gray>
arena.players-only={prefix}<red>Only players can create an arena at their current position.</red>

event.pvp-override={prefix}<gold>[Event] Global PvP override {status}.</gold>
event.status-enabled=<green>enabled</green>
event.status-disabled=<red>disabled</red>

admin.reload-success={prefix}<green>Life SMP configuration reloaded.</green>
admin.set-lives={prefix}<green>Lives of <yellow>{player}</yellow> set to {lives}.</green>
admin.set-player-not-found={prefix}<red>Player <yellow>{player}</yellow> was not found in the database.</red>
admin.pardon-success={prefix}<green><yellow>{player}</yellow> was pardoned and now has 1 life.</green>
admin.pardon-not-banned={prefix}<red><yellow>{player}</yellow> is not banned for losing all lives.</red>
admin.pardon-player-not-found={prefix}<red>Player <yellow>{player}</yellow> was not found in the database.</red>
admin.pardon-join-notify={prefix}<gold>You were pardoned by an administrator. You have 1 life.</gold>
admin.reset-success={prefix}<green>Lives of <yellow>{player}</yellow> were fully restored ({max}/{max}).</green>
admin.reset-player-notify={prefix}<green>An administrator fully restored your lives ({lives}/{max}).</green>
admin.reset-player-not-found={prefix}<red>Player <yellow>{player}</yellow> was not found in the database.</red>

command.players-only={prefix}<red>This command can only be used by players.</red>
command.profile-not-loaded={prefix}<red>Player data is not loaded yet. Try again in a moment.</red>

help.header=<dark_gray>──────</dark_gray> <green><bold>Life SMP Help</bold></green> <dark_gray>──────</dark_gray>
help.info=<yellow>/life</yellow> <gray>- show your lives and regeneration timer</gray>
help.gift=<yellow>/life gift <player></yellow> <gray>- offer one of your lives to another player</gray>
help.accept=<yellow>/life accept</yellow> <gray>- accept a pending life gift</gray>
help.admin-header=<red><bold>Admin commands:</bold></red>
help.pardon=<yellow>/life pardon <player></yellow> <gray>- unban an eliminated player (1 life)</gray>
help.reset=<yellow>/life reset <player></yellow> <gray>- fully restore lives ({max}/{max})</gray>
help.set=<yellow>/life set <player> <1-3></yellow> <gray>- set a player's lives</gray>
help.reload=<yellow>/life reload</yellow> <gray>- reload the configuration</gray>
help.event=<yellow>/life event pvp-override <true|false> [minutes]</yellow> <gray>- global PvP event</gray>
help.arena=<yellow>/life arena <create|remove|enable|disable|list></yellow> <gray>- manage arenas</gray>
help.footer=<dark_gray>─────────────────────────────────</dark_gray>

time.day=d
time.hour=h
time.minute=m
time.second=s

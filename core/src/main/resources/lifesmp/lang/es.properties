gift.accepted-donor={prefix}<green><yellow>{player}</yellow> ha aceptado tu regalo. La regeneración acelerada está activa.</green>
gift.accepted-recipient={prefix}<green>Has aceptado una vida de <yellow>{player}</yellow>. Tus vidas: {lives}.</green>
gift.expired={prefix}<red>La solicitud de regalo de vida ha caducado o se ha cancelado.</red>
gift.cannot-gift-self={prefix}<red>No puedes regalarte una vida a ti mismo.</red>
gift.donor-last-life={prefix}<red>No puedes regalar tu última vida. Necesitas al menos 2 vidas.</red>
gift.recipient-max-lives={prefix}<red>Este jugador ya tiene el número máximo de vidas.</red>
gift.no-pending={prefix}<red>No tienes solicitudes de regalo de vida pendientes.</red>
gift.player-offline={prefix}<red>El jugador <yellow>{player}</yellow> no se ha encontrado o no está conectado.</red>
gift.cannot-afford={prefix}<red>No puedes permitirte regalar una vida.</red>
gift.failed={prefix}<red>No se ha podido completar el regalo de vida.</red>

info.header=<dark_gray>──────</dark_gray> {color}<bold>Life SMP</bold></color> <dark_gray>──────</dark_gray>
info.lives=<gray>Vidas:</gray> {hearts} <gray>({lives}/{max})</gray>

death.arena-death={prefix}<gold>Has muerto en una arena. Conservas tu vida.</gold>

regen.life-gained={prefix}<green>Has recuperado una vida. Vidas actuales: {lives}</green>

gift.sent={prefix}<green>Has ofrecido una vida a <yellow>{player}</yellow>. Esperando confirmación ({time}).</green>

info.mode-gift=<gray>Regeneración acelerada:</gray> <green>activa</green> <gray>(intervalo {time})</gray>
info.mode-normal=<gray>Regeneración normal</gray> <gray>(intervalo {time})</gray>
info.afk-paused=<yellow>Temporizador en pausa: AFK</yellow>
info.footer=<dark_gray>────────────────────────</dark_gray>

arena.created={prefix}<green>La arena '{name}' se ha creado y activado.</green>
arena.removed={prefix}<green>La arena '{name}' se ha eliminado.</green>
arena.not-found={prefix}<red>No se ha encontrado la arena '{name}'.</red>
arena.already-exists={prefix}<red>Ya existe una arena llamada '{name}'. Elimínala primero o elige otro nombre.</red>
arena.status-updated={prefix}<green>La arena '{name}' ahora está {status}.</green>

# Life SMP messages: Spanish (es).

pvp.red-cannot-attack-red={prefix}<red>No puedes atacar mientras tengas 1 vida</red>
pvp.cannot-attack-red={prefix}<red>No puedes atacar a un jugador que tiene 1 vida</red>

death.ban-kick=<red><bold>☠ HAS PERDIDO TODAS TUS VIDAS</bold></red>\n\n<gray>Motivo:</gray> <white>Sin vidas restantes</white>\n<gray>Duración del baneo:</gray> <yellow>{time}</yellow>\n\n<dark_gray>Contacta con el equipo del servidor para más detalles</dark_gray>
death.ban-join=<red><bold>Estás baneado por perder todas tus vidas</bold></red>\n\n<gray>Tiempo restante:</gray> <yellow>{time}</yellow>\n<dark_gray>Espera a que termine el baneo o a que un administrador te perdone.</dark_gray>

command.players-only={prefix}<red>Este comando solo puede usarlo un jugador.</red>
command.profile-not-loaded={prefix}<red>Los datos del jugador aún no se han cargado. Inténtalo de nuevo en un momento.</red>

help.header=<dark_gray>──────</dark_gray> <green><bold>Ayuda de Life SMP</bold></green> <dark_gray>──────</dark_gray>
help.info=<yellow>/life</yellow> <gray>- muestra tus vidas y el temporizador de regeneración</gray>
help.gift=<yellow>/life gift <player></yellow> <gray>- ofrece una de tus vidas a otro jugador</gray>
help.accept=<yellow>/life accept</yellow> <gray>- acepta un regalo de vida pendiente</gray>
help.admin-header=<red><bold>Comandos de administrador:</bold></red>
help.pardon=<yellow>/life pardon <player></yellow> <gray>- perdona a un jugador eliminado (1 vida)</gray>
help.reset=<yellow>/life reset <player></yellow> <gray>- restaura todas las vidas ({max}/{max})</gray>
help.set=<yellow>/life set <player> <1-3></yellow> <gray>- establece las vidas de un jugador</gray>
help.reload=<yellow>/life reload</yellow> <gray>- recarga la configuración</gray>
help.event=<yellow>/life event pvp-override <true|false> [minutes]</yellow> <gray>- evento PvP global</gray>
help.arena=<yellow>/life arena <create|remove|enable|disable|list></yellow> <gray>- gestiona las arenas</gray>
help.footer=<dark_gray>─────────────────────────────────</dark_gray>

time.day=d
time.hour=h
time.minute=m

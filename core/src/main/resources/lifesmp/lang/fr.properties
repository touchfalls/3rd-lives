gift.accepted-recipient={prefix}<green>Vous avez accepté une vie de <yellow>{player}</yellow>. Vos vies : {lives}.</green>
gift.expired={prefix}<red>La demande de don de vie a expiré ou a été annulée.</red>
gift.cannot-gift-self={prefix}<red>Vous ne pouvez pas vous offrir une vie à vous-même.</red>
gift.donor-last-life={prefix}<red>Vous ne pouvez pas donner votre dernière vie. Il vous faut au moins 2 vies.</red>
gift.recipient-max-lives={prefix}<red>Ce joueur a déjà le nombre maximum de vies.</red>
gift.no-pending={prefix}<red>Vous n'avez aucune demande de don de vie en attente.</red>
gift.player-offline={prefix}<red>Le joueur <yellow>{player}</yellow> est introuvable ou hors ligne.</red>
gift.cannot-afford={prefix}<red>Vous n'avez pas les moyens d'offrir une vie.</red>
gift.failed={prefix}<red>Le don de vie n'a pas pu être effectué.</red>


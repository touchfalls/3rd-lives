help.header=<dark_gray>──────</dark_gray> <green><bold>Aide Life SMP</bold></green> <dark_gray>──────</dark_gray>
help.info=<yellow>/life</yellow> <gray>- afficher vos vies et le minuteur de régénération</gray>
help.gift=<yellow>/life gift <player></yellow> <gray>- offrir une de vos vies à un autre joueur</gray>
help.accept=<yellow>/life accept</yellow> <gray>- accepter un don de vie en attente</gray>
help.admin-header=<red><bold>Commandes d'administration :</bold></red>
help.pardon=<yellow>/life pardon <player></yellow> <gray>- gracier un joueur éliminé (1 vie)</gray>
help.reset=<yellow>/life reset <player></yellow> <gray>- restaurer toutes les vies ({max}/{max})</gray>
help.set=<yellow>/life set <player> <1-3></yellow> <gray>- définir les vies d'un joueur</gray>
help.reload=<yellow>/life reload</yellow> <gray>- recharger la configuration</gray>
help.event=<yellow>/life event pvp-override <true|false> [minutes]</yellow> <gray>- événement PvP global</gray>
help.arena=<yellow>/life arena <create|remove|enable|disable|list></yellow> <gray>- gérer les arènes</gray>
help.footer=<dark_gray>─────────────────────────────────</dark_gray>


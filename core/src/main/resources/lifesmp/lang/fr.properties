death.arena-death={prefix}<gold>Vous êtes mort dans une arène. Votre vie est conservée.</gold>

regen.life-gained={prefix}<green>Vous avez récupéré une vie. Vies actuelles : {lives}</green>

gift.sent={prefix}<green>Vous avez proposé une vie à <yellow>{player}</yellow>. En attente de confirmation ({time}).</green>

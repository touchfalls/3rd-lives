# Life SMP messages: French (fr).

pvp.red-cannot-attack-red={prefix}<red>Vous ne pouvez pas attaquer tant qu'il vous reste 1 vie</red>
pvp.cannot-attack-red={prefix}<red>Vous ne pouvez pas attaquer un joueur qui n'a plus qu'une vie</red>

death.ban-kick=<red><bold>☠ VOUS AVEZ PERDU TOUTES VOS VIES</bold></red>\n\n<gray>Raison :</gray> <white>Plus aucune vie</white>\n<gray>Durée du bannissement :</gray> <yellow>{time}</yellow>\n\n<dark_gray>Contactez l'équipe du serveur pour plus de détails</dark_gray>
death.ban-join=<red><bold>Vous êtes banni pour avoir perdu toutes vos vies</bold></red>\n\n<gray>Temps restant :</gray> <yellow>{time}</yellow>\n<dark_gray>Attendez la fin du bannissement ou la grâce d'un administrateur.</dark_gray>
death.life-lost=<dark_gray>▪ <red>☠ Vous êtes mort.</red> <gray>Vies restantes :</gray> {hearts} <gray>({lives}/{max})</gray>

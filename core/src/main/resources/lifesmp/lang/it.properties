help.header=<dark_gray>──────</dark_gray> <green><bold>Guida Life SMP</bold></green> <dark_gray>──────</dark_gray>
help.info=<yellow>/life</yellow> <gray>- mostra le tue vite e il timer di rigenerazione</gray>
help.gift=<yellow>/life gift <player></yellow> <gray>- offri una delle tue vite a un altro giocatore</gray>
help.accept=<yellow>/life accept</yellow> <gray>- accetta un regalo di vita in sospeso</gray>
help.admin-header=<red><bold>Comandi amministratore:</bold></red>
help.pardon=<yellow>/life pardon <player></yellow> <gray>- grazia un giocatore eliminato (1 vita)</gray>
help.reset=<yellow>/life reset <player></yellow> <gray>- ripristina tutte le vite ({max}/{max})</gray>
help.set=<yellow>/life set <player> <1-3></yellow> <gray>- imposta le vite di un giocatore</gray>
help.reload=<yellow>/life reload</yellow> <gray>- ricarica la configurazione</gray>
help.event=<yellow>/life event pvp-override <true|false> [minutes]</yellow> <gray>- evento PvP globale</gray>
help.arena=<yellow>/life arena <create|remove|enable|disable|list></yellow> <gray>- gestisci le arene</gray>
help.footer=<dark_gray>─────────────────────────────────</dark_gray>


gift.recipient-max-lives={prefix}<red>У игрока уже максимальное количество жизней!</red>
gift.no-pending={prefix}<red>У вас нет активных запросов на подарок жизни.</red>
gift.player-offline={prefix}<red>Игрок <yellow>{player}</yellow> не найден или не в сети.</red>
gift.cannot-afford={prefix}<red>Вам не хватает средств, чтобы подарить жизнь.</red>
gift.failed={prefix}<red>Не удалось передать жизнь.</red>


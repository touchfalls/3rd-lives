# Life SMP Configuration (Paper Adapter)

# Global message prefix
prefix: "<dark_gray>[<gradient:#55FF55:#FFAA00>Life</gradient>]</dark_gray> "

# Maximum lives a player can accumulate
max-lives: 3

# Real-world hours a player is banned after losing all lives (0 lives)
ban-hours: 24.0

# Number of lives restored when player logs in after ban expires
restored-lives-after-ban: 3

# Online hours required to regenerate 1 life (without AFK)
regen-hours-per-life: 10.0

# Accelerated online hours required to regenerate 1 life for a donor after gifting
gift-regen-hours-per-life: 2.5

# Inactivity duration in minutes before a player is considered AFK (pauses regen timer)
afk-minutes: 180.0

# Time window in seconds during which a victim can retaliate against a red attacker
retaliation-window-seconds: 30

# Time window in seconds before a pending /life gift request expires
gift-request-timeout-seconds: 60

# Interval in minutes for background SQLite database autosave
autosave-minutes: 5.0

# Settings for displaying banned (dead) players in the TAB list
dead-tab:
  enabled: true
  format: "<gray>☠ {player}</gray> <dark_gray>[DEAD]</dark_gray>"
  color: "#AAAAAA"
  show-time: false
  max-entries: 50
  sort-last: true

# Hex colors according to life count
colors:
  3: "#55FF55" # Green
  2: "#FFAA00" # Gold
  1: "#FF5555" # Red
  0: "#AAAAAA" # Gray (Dead/Banned)

# MiniMessage-formatted messages
messages:
  pvp.red-cannot-attack-red: "{prefix}<red>Вы не можете нападать, пока у вас 1 жизнь</red>"
  pvp.cannot-attack-red: "{prefix}<red>Вы не можете нападать на игрока с 1 жизнью</red>"
  death.ban-kick: "<red><bold>☠ ВЫ ПОТЕРЯЛИ ВСЕ ЖИЗНИ!</bold></red>\n\n<gray>Причина:</gray> <white>Исчерпан лимит жизней</white>\n<gray>Срок бана:</gray> <yellow>{time}</yellow>\n\n<dark_gray>Подробнее: обратитесь к администрации сервера</dark_gray>"
  death.ban-join: "<red><bold>Вы забанены за потерю всех жизней!</bold></red>\n\n<gray>До окончания бана осталось:</gray> <yellow>{time}</yellow>\n<dark_gray>Ожидайте окончания срока или помилования администратором.</dark_gray>"

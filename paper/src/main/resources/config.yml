# Life SMP Configuration (Paper Adapter)

# Language of the built-in messages: en, ru, fr, it, es
language: en

# Global message prefix
prefix: "<dark_gray>[<gradient:#55FF55:#FFAA00>Life</gradient>]</dark_gray> "

# Maximum lives a player can accumulate
max-lives: 3

# Real-world hours a player is banned after losing all lives (0 lives)
ban-hours: 24.0

# Number of lives restored when player logs in after ban expires
restored-lives-after-ban: 3

# Online hours required to regenerate 1 life (without AFK)
regen-hours-per-life: 10.0

# Accelerated online hours required to regenerate 1 life for a donor after gifting
gift-regen-hours-per-life: 2.5

# Inactivity duration in minutes before a player is considered AFK (pauses regen timer).
# Set to -1 to turn AFK detection off.
afk-minutes: 180.0

# Time window in seconds during which a victim can retaliate against a red attacker
retaliation-window-seconds: 30

# Time window in seconds before a pending /life gift request expires
gift-request-timeout-seconds: 60

# Interval in minutes for background SQLite database autosave
autosave-minutes: 5.0

# Settings for displaying banned (dead) players in the TAB list
dead-tab:
  enabled: true
  format: "<gray>☠ {player}</gray> <dark_gray>[DEAD]</dark_gray>"
  color: "#AAAAAA"
  show-time: false
  max-entries: 50
  sort-last: true

# Hex colors according to life count
colors:
  3: "#55FF55" # Green
  2: "#FFAA00" # Gold
  1: "#FF5555" # Red
  0: "#AAAAAA" # Gray (Dead/Banned)

# Optional message overrides in MiniMessage format. Any key from the built-in
# language files can be set here and takes precedence over the selected language.
# The full list of keys is in the README. Example:
# messages:
#   gift.sent: "{prefix}<green>Life offered to <yellow>{player}</yellow>.</green>"

# Bounties: players put a price on someone's head, and the server marks rampaging players as wanted
bounty:
  enabled: true
  # Online hours (not AFK) the target must survive to take the stake. Also how long "wanted" lasts.
  duration-hours: 12.0
  # Share of the staked XP that is burned when a bounty is placed
  tax-percent: 10
  # Share of the stake returned when the issuer cancels
  cancel-refund-percent: 75
  # XP levels every bounty must stake
  min-xp: 5
  # Lowest buyout price in XP levels the issuer may set
  min-buyout: 5
  # Hours before the same hunter can claim a bounty on the same target again
  pair-cooldown-hours: 24.0
  # Active bounties one player may place at a time
  max-active-per-issuer: 1
  # PvP kills in a row without dying that make a player wanted
  wanted-streak: 3
  # Shown after the name of a player with a bounty or wanted status
  icon: "☠"
